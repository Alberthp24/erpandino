<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de gestión | ERP Andino Perú</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <main class="panel">
    <header class="panel-encabezado">
      <h1>Panel de gestión</h1>
      <p id="usuario-activo"></p>
      <a href="caja.html" id="enlace-caja" class="enlace-caja" hidden>Ir a Caja</a>
      <button type="button" id="btn-salir">Cerrar sesión</button>
    </header>

    <section class="panel-formulario">
      <h2 id="titulo-form">Nueva solicitud</h2>
      <form id="form-panel">
        <input type="hidden" id="registro-id">

        <label for="empresa">Nombre de la empresa</label>
        <input type="text" id="empresa" required>

        <label for="correo">Correo</label>
        <input type="email" id="correo" required>

        <label for="tamano">Tamaño de la empresa</label>
        <select id="tamano" required>
          <option value="pequena">Pequeña empresa</option>
          <option value="mediana">Mediana empresa</option>
          <option value="grande">Gran empresa</option>
        </select>

        <fieldset id="grupo-tarifa">
          <legend>Cuota de instalación</legend>
          <label class="opcion">
            <input type="checkbox" id="modulo_ventas"> Ventas (S/ 350)
          </label>
          <label class="opcion">
            <input type="checkbox" id="modulo_planilla"> Planilla (S/ 350)
          </label>
          <label class="opcion">
            <input type="checkbox" id="modulo_almacen"> Almacén (S/ 350)
          </label>

          <label for="sucursales">Sucursales adicionales (S/ 150 c/u)</label>
          <input type="number" id="sucursales" min="0" step="1" value="0" required>
        </fieldset>

        <p class="monto">Cuota calculada:
          <output id="monto-estimado" aria-live="polite">S/ 0.00</output>
        </p>

        <label for="estado">Estado</label>
        <select id="estado">
          <option value="registrado">Registrado</option>
          <option value="atendido">Atendido</option>
          <option value="rechazado">Rechazado</option>
        </select>

        <button type="submit" id="btn-guardar">Crear</button>
        <button type="button" id="btn-cancelar" hidden>Cancelar edición</button>
      </form>
      <p id="mensaje-panel" role="status"></p>
    </section>

    <section class="panel-tabla">
      <h2>Todas las solicitudes</h2>
      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Empresa</th>
              <th>Tamaño</th>
              <th>Correo</th>
              <th>Estado</th>
              <th>Monto</th>
              <th>Pago</th>
              <th>Usuario</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-cuerpo"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="js/panel/panel.js"></script>
</body>
</html>
